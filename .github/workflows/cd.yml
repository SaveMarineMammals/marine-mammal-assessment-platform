# Progressive CD on merge to main: quality gates → staging infra+app+full verify →
# production infra+app+smoke verify. Fully automatic after staging verification passes.

name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

jobs:
  quality:
    name: Lint, format & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  integration:
    name: API & field sync integration
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mmap
          POSTGRES_PASSWORD: mmap
          POSTGRES_DB: mmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmap -d mmap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mmap:mmap@localhost:5432/mmap
      API_ADMIN_TOKEN: dev-admin-token
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo ^build compiles workspace deps of @mmap/api. Prefer --filter on the
      # entrypoint package over hardcoding shared package names.
      - name: Build API and workspace dependencies
        run: pnpm turbo build --filter=@mmap/api

      - name: Integration tests
        run: pnpm test:integration -- --database-url postgresql://mmap:mmap@localhost:5432/mmap

  staging-infra:
    name: Terraform apply (staging)
    runs-on: ubuntu-latest
    needs: [quality, analyze, build, integration]
    if: vars.TF_INFRA_ENABLED == 'true'
    environment: staging
    concurrency:
      group: mmap-terraform
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Terraform apply staging
        uses: ./.github/actions/terraform
        with:
          working-directory: infra/terraform/environments/staging
          command: apply
          aws-role-arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-key: staging/terraform.tfstate
          lock-table: ${{ secrets.TF_LOCK_TABLE }}

  staging-app:
    name: Deploy app (staging)
    needs: staging-infra
    if: vars.TF_INFRA_ENABLED == 'true'
    uses: ./.github/workflows/_deploy-app.yml
    with:
      environment: staging
      image_tag: ${{ github.sha }}
    secrets: inherit

  staging-verify:
    name: Verify staging (full)
    needs: staging-app
    if: vars.TF_INFRA_ENABLED == 'true'
    uses: ./.github/workflows/_verify-env.yml
    with:
      environment: staging
      mode: full
      resume_hibernate: true
    secrets: inherit

  production-infra:
    name: Terraform apply (production)
    runs-on: ubuntu-latest
    needs: staging-verify
    if: vars.TF_INFRA_ENABLED == 'true'
    environment: production
    concurrency:
      group: mmap-terraform
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Terraform apply production
        uses: ./.github/actions/terraform
        with:
          working-directory: infra/terraform/environments/production
          command: apply
          aws-role-arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-key: production/terraform.tfstate
          lock-table: ${{ secrets.TF_LOCK_TABLE }}

  production-app:
    name: Deploy app (production)
    needs: production-infra
    if: vars.TF_INFRA_ENABLED == 'true'
    uses: ./.github/workflows/_deploy-app.yml
    with:
      environment: production
      image_tag: ${{ github.sha }}
    secrets: inherit

  production-verify:
    name: Verify production (smoke)
    needs: production-app
    if: vars.TF_INFRA_ENABLED == 'true'
    uses: ./.github/workflows/_verify-env.yml
    with:
      environment: production
      mode: smoke
      resume_hibernate: false
    secrets: inherit
