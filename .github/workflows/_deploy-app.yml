# Reusable application deploy: static sites → Lambda zip.
# Database migrations run on Lambda cold start (private RDS is not reachable
# from GitHub-hosted runners).
#
# Caller must grant contents:read and id-token:write. Uses GitHub Environment
# secrets for the target environment (staging | production).

name: Deploy app

on:
  workflow_call:
    inputs:
      environment:
        description: Target GitHub/AWS environment
        required: true
        type: string
      image_tag:
        description: Unused (kept for caller compatibility)
        required: false
        type: string
        default: ''
      git_ref:
        description: Git ref to checkout
        required: false
        type: string
        default: ''
      web_cloudfront_id:
        description: CloudFront distribution id from terraform apply (preferred over secret)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy app (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      LAMBDA_FUNCTION_NAME: mmap-${{ inputs.environment }}-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build static sites
        shell: pwsh
        run: pnpm turbo build --filter=@mmap/web --filter=@mmap/field
        env:
          VITE_DOCS_URL: /docs/manatee-v1

      - name: Package API Lambda
        shell: pwsh
        run: pnpm --filter @mmap/api package:lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync web static assets to S3
        shell: pwsh
        run: aws s3 sync apps/web/dist/ "s3://${{ secrets.WEB_STATIC_BUCKET }}/" --delete

      - name: Sync field static assets to S3
        shell: pwsh
        run: aws s3 sync apps/field/dist/ "s3://${{ secrets.FIELD_STATIC_BUCKET }}/field/app/" --delete

      - name: Deploy API Lambda code
        shell: pwsh
        run: |
          aws lambda update-function-code `
            --function-name $env:LAMBDA_FUNCTION_NAME `
            --zip-file "fileb://apps/api/dist/api-lambda.zip"

      - name: Wait for Lambda update
        shell: pwsh
        run: |
          aws lambda wait function-updated-v2 --function-name $env:LAMBDA_FUNCTION_NAME

      - name: Trigger dataset snapshot export
        shell: pwsh
        run: |
          aws lambda invoke `
            --function-name $env:LAMBDA_FUNCTION_NAME `
            --cli-binary-format raw-in-base64-out `
            --payload '{"job":"dataset-export"}' `
            export-out.json
          Get-Content export-out.json

      - name: Invalidate CloudFront caches
        shell: pwsh
        env:
          WEB_CLOUDFRONT_ID: ${{ inputs.web_cloudfront_id || secrets.WEB_CLOUDFRONT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEB_CLOUDFRONT_ID)) {
            Write-Output "Skipping CloudFront invalidation (enable_cdn=false or WEB_CLOUDFRONT_ID unset)."
            exit 0
          }
          Write-Output "Invalidating CloudFront distribution $($env:WEB_CLOUDFRONT_ID)"
          aws cloudfront create-invalidation --distribution-id $env:WEB_CLOUDFRONT_ID --paths "/*"

      - name: Wait for API health
        shell: pwsh
        run: |
          # Resolve Function URL from AWS (no GitHub Environment secret).
          $apiUrl = (
            aws lambda get-function-url-config `
              --function-name $env:LAMBDA_FUNCTION_NAME `
              --query FunctionUrl `
              --output text
          ).Trim().TrimEnd('/')
          if ([string]::IsNullOrWhiteSpace($apiUrl) -or $apiUrl -eq 'None') {
            throw "Could not resolve Function URL for $($env:LAMBDA_FUNCTION_NAME)."
          }
          $healthUrl = "$apiUrl/v1/health"
          Write-Output "Probing $healthUrl"
          $deadline = (Get-Date).AddMinutes(10)
          do {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 30
              if ($response.StatusCode -eq 200) {
                Write-Output "Healthy: $healthUrl"
                exit 0
              }
              Write-Output "HTTP $($response.StatusCode) from $healthUrl"
            } catch {
              Write-Output "Not ready: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $deadline)
          throw "Timed out waiting for $healthUrl"
