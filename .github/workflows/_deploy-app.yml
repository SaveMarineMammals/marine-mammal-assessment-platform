# Reusable application deploy: static sites → ECR → ECS Express.
# Database migrations run on API container startup (private RDS is not reachable
# from GitHub-hosted runners).
#
# Caller must grant contents:read and id-token:write. Uses GitHub Environment
# secrets for the target environment (staging | production).

name: Deploy app

on:
  workflow_call:
    inputs:
      environment:
        description: Target GitHub/AWS environment
        required: true
        type: string
      image_tag:
        description: Docker/ECR image tag (defaults to short SHA)
        required: false
        type: string
        default: ''
      git_ref:
        description: Git ref to checkout
        required: false
        type: string
        default: ''
      web_cloudfront_id:
        description: CloudFront distribution id from terraform apply (preferred over secret)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy app (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ECR_REPOSITORY: mmap-${{ inputs.environment }}-api
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # Turbo ^build compiles workspace deps (schema, geo-time, …). Add a --filter for
      # each new static app that should ship; do not hardcode shared package names.
      - name: Build static sites
        shell: pwsh
        run: pnpm turbo build --filter=@mmap/web --filter=@mmap/field
        env:
          VITE_DOCS_URL: /docs/manatee-v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync web static assets to S3
        shell: pwsh
        run: aws s3 sync apps/web/dist/ "s3://${{ secrets.WEB_STATIC_BUCKET }}/" --delete

      - name: Sync field static assets to S3
        shell: pwsh
        run: aws s3 sync apps/field/dist/ "s3://${{ secrets.FIELD_STATIC_BUCKET }}/field/app/" --delete

      - name: Invalidate CloudFront caches
        shell: pwsh
        env:
          # Prefer id from the terraform apply job (avoids stale GitHub secrets after CDN replace).
          WEB_CLOUDFRONT_ID: ${{ inputs.web_cloudfront_id || secrets.WEB_CLOUDFRONT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEB_CLOUDFRONT_ID)) {
            Write-Output "Skipping CloudFront invalidation (enable_cdn=false or WEB_CLOUDFRONT_ID unset)."
            exit 0
          }
          Write-Output "Invalidating CloudFront distribution $($env:WEB_CLOUDFRONT_ID)"
          aws cloudfront create-invalidation --distribution-id $env:WEB_CLOUDFRONT_ID --paths "/*"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        shell: pwsh
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f apps/api/Dockerfile -t "${env:ECR_REGISTRY}/${env:ECR_REPOSITORY}:${env:IMAGE_TAG}" .
          docker push "${env:ECR_REGISTRY}/${env:ECR_REPOSITORY}:${env:IMAGE_TAG}"

      # Migrations run in apps/api on container start (before listen / health checks).
      # Pass full env + secrets: UpdateExpressGatewayService replaces primary-container
      # config, so image-only updates wipe Terraform-provisioned secrets and leave nginx.
      - name: Deploy API to ECS Express
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        with:
          service-name: ${{ secrets.ECS_SERVICE_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          execution-role-arn: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
          task-role-arn: ${{ secrets.ECS_TASK_ROLE_ARN }}
          container-port: '3001'
          health-check-path: /v1/health
          cpu: '1024'
          memory: '2048'
          log-group: /mmap-${{ inputs.environment }}/api
          log-stream-prefix: ecs
          min-task-count: 1
          max-task-count: 4
          environment-variables: |
            [
              {"name": "PORT", "value": "3001"},
              {"name": "HOST", "value": "0.0.0.0"},
              {"name": "NODE_ENV", "value": "production"},
              {"name": "CORS_ORIGIN", "value": "${{ secrets.API_CORS_ORIGIN }}"},
              {"name": "MINIO_ENDPOINT", "value": ""},
              {"name": "PUBLIC_PSEUDONYMIZE_NAMES", "value": "false"},
              {"name": "DB_HOST", "value": "${{ secrets.DB_HOST }}"},
              {"name": "DB_PORT", "value": "${{ secrets.DB_PORT }}"},
              {"name": "DB_NAME", "value": "${{ secrets.DB_NAME }}"}
            ]
          secrets: |
            [
              {"name": "DATABASE_URL", "valueFrom": "${{ secrets.DATABASE_SECRET_ARN }}"},
              {"name": "API_ADMIN_TOKEN", "valueFrom": "${{ secrets.API_ADMIN_TOKEN_SECRET_ARN }}"}
            ]

      - name: Wait for API health
        shell: pwsh
        env:
          API_SERVICE_URL: ${{ secrets.API_SERVICE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_SERVICE_URL)) {
            throw "API_SERVICE_URL secret is required (terraform output api_service_url)."
          }
          $healthUrl = "$($env:API_SERVICE_URL.TrimEnd('/'))/v1/health"
          $deadline = (Get-Date).AddMinutes(10)
          do {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -eq 200) {
                Write-Output "Healthy: $healthUrl"
                exit 0
              }
              Write-Output "HTTP $($response.StatusCode) from $healthUrl"
            } catch {
              Write-Output "Not ready: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $deadline)
          throw "Timed out waiting for $healthUrl"
