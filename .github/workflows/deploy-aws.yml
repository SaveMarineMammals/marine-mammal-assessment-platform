# Emergency / ad-hoc application deploy (infra must already exist).
# Progressive promotion on merge to main is owned by cd.yml — this workflow
# is workflow_dispatch only (no tag→production auto-deploy).

name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    uses: ./.github/workflows/_deploy-app.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ github.sha }}
    secrets: inherit
