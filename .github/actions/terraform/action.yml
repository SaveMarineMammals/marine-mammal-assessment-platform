name: Terraform
description: Initialize Terraform and run plan or apply for an MMAP environment.

inputs:
  working-directory:
    description: Path to the Terraform environment root
    required: true
  command:
    description: plan or apply
    required: true
  aws-role-arn:
    description: IAM role ARN to assume via OIDC
    required: true
  aws-region:
    description: AWS region
    required: false
    default: us-east-1
  state-bucket:
    description: S3 bucket for remote state
    required: true
  state-key:
    description: S3 object key for this environment state file
    required: true
  lock-table:
    description: DynamoDB table for state locking
    required: true
  var-file:
    description: Optional terraform.tfvars path relative to working-directory
    required: false
    default: terraform.tfvars

outputs:
  destroy_detected:
    description: Whether the plan includes resource deletions
    value: ${{ steps.plan.outputs.destroy_detected }}
  web_cloudfront_id:
    description: Site CloudFront distribution id after apply (empty when enable_cdn=false)
    value: ${{ steps.apply_outputs.outputs.web_cloudfront_id }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: pwsh
      run: pnpm install --frozen-lockfile

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Terraform init
      shell: pwsh
      run: |
        pnpm exec tsx scripts/terraform-init.ts `
          "${{ inputs.working-directory }}" `
          "${{ inputs.state-bucket }}" `
          "${{ inputs.state-key }}" `
          "${{ inputs.aws-region }}" `
          "${{ inputs.lock-table }}"

    - name: Terraform plan
      if: inputs.command == 'plan'
      id: plan
      shell: pwsh
      run: |
        pnpm exec tsx scripts/terraform-plan.ts "${{ inputs.working-directory }}" "${{ inputs.var-file }}"

    - name: Terraform apply
      if: inputs.command == 'apply'
      shell: pwsh
      run: |
        pnpm exec tsx scripts/terraform-apply.ts "${{ inputs.working-directory }}" "${{ inputs.var-file }}"

    - name: Capture apply outputs
      if: inputs.command == 'apply'
      id: apply_outputs
      shell: pwsh
      run: |
        $cwd = "${{ inputs.working-directory }}"
        $enableCdn = ''
        try {
          $enableCdn = (terraform -chdir=$cwd output -raw enable_cdn).Trim()
        } catch {
          $enableCdn = 'false'
        }
        $id = ''
        if ($enableCdn -eq 'true') {
          $id = (terraform -chdir=$cwd output -raw web_cloudfront_distribution_id).Trim()
        }
        "web_cloudfront_id=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Output "web_cloudfront_id=$id (enable_cdn=$enableCdn)"
